# Central path configuration for NIBS processing pipelines.
#
# Local-filesystem setup. Every value below is an ABSOLUTE path; config.py joins
# each against project_root, but os.path.join() returns an absolute second
# argument unchanged, so project_root is effectively ignored here. This keeps the
# raw BIDS dataset, the derivatives, and the working directories on independent
# roots.
project_root: /cbica/projects/nibs

# Raw BIDS dataset (contains sub-*/ directly).
bids_dir: dset
# Repository checkout holding this code (configuration/, processing/, ...).
code_dir: code
# Scratch/working directory for intermediate files (SEPIA + chi-sep inputs/outputs).
work_dir: /cbica/comp_space/nibs

sourcedata:
  root: sourcedata
  scitran: sourcedata/scitran/bbl/NIBS_857664

derivatives:
  smriprep: derivatives/smriprep
  pymp2rage: derivatives/pymp2rage
  ihmt: derivatives/ihmt
  mese: derivatives/mese
  megre: derivatives/megre
  qsm: derivatives/qsm
  t1wt2w_ratio: derivatives/t1wt2w_ratio
  g_ratio: derivatives/g_ratio
  myelin: derivatives/myelin
  qsiprep: derivatives/qsiprep
  qsirecon_dipydki: derivatives/qsirecon/derivatives/qsirecon-DIPYDKI
  qsirecon_noddi: derivatives/qsirecon/derivatives/qsirecon-NODDI
  qsirecon_dsistudio: derivatives/qsirecon/derivatives/qsirecon-DSIStudio

# Container runtime used for SynthStrip skull-stripping. Either "apptainer"
# (uses the apptainer.synthstrip .sif below) or "docker" (uses the
# docker.synthstrip image tag below).
synthstrip_runtime: docker

apptainer:
  # Used by process_mese.py / process_ihmt.py for SynthStrip skull-stripping.
  # Requires a local singularity/apptainer install and this .sif image.
  synthstrip: apptainer/synthstrip-1.7.sif

docker:
  # Used to locally test processing on a machine without Apptainer
  synthstrip: freesurfer/synthstrip:1.7

freesurfer:
  subjects_dir: derivatives/smriprep/sourcedata/freesurfer
  license: tokens/freesurfer_license.txt
